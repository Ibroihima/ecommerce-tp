# Environnement du TP : Tomcat + Jenkins + SonarQube (+ PostgreSQL pour SonarQube)
#   Tomcat    -> http://localhost:8080   (application : /shop, manager : /manager)
#   Jenkins   -> http://localhost:8081
#   SonarQube -> http://localhost:9000
services:
  jenkins:
    build: ./docker/jenkins
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - tp-net

  tomcat:
    build: ./docker/tomcat
    container_name: tomcat
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - tp-net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Évite l'échec au démarrage si vm.max_map_count est trop bas (TP uniquement)
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    networks:
      - tp-net

  sonar-db:
    image: postgres:15
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    networks:
      - tp-net

networks:
  tp-net:
    driver: bridge

volumes:
  jenkins_home:
  sonar_data:
  sonar_logs:
  sonar_extensions:
  sonar_db:
